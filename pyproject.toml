[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-assistant"
version = "1.0.0"
description = "Technical analysis, strategy backtesting, and risk management toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
live = ["yfinance>=0.2"]
dev = ["pytest>=7"]

[project.scripts]
trading-assistant = "trading_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["trading_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
